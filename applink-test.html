<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KG Print – app link test</title>
<style>body{font:16px system-ui,sans-serif;margin:16px;background:#f6f4ee;color:#17171a}h2{margin:22px 0 8px}
a{display:block;padding:14px;margin:8px 0;border:2px solid #17171a;border-radius:12px;background:#fff;color:#17171a;text-decoration:none;font-weight:600}
small{display:block;font-weight:400;color:#666;word-break:break-all;font-size:11px}#msg{position:sticky;top:0;background:#7a4a00;color:#fff;padding:10px;border-radius:10px;display:none}</style></head><body>
<h1>App link test</h1>
<p>Tap each button. Note the <b>number</b> and what happened: <b>✅ opened the app normally</b> / ⚠ error page in the app / ❌ didn't open / Play Store. Come back here after each one.</p>
<div id="msg"></div>
<div id="list"></div>
<script>
const back = (id) => encodeURIComponent(location.href.split("#")[0] + "#fail-" + id);
const P = "net.one97.paytm", G = "com.google.android.apps.nbu.paisa.user", PE = "com.phonepe.app";
const tests = [
  ["Paytm", [
    ["P1", (id) => `intent://#Intent;scheme=paytmmp;package=${P};S.browser_fallback_url=${back(id)};end`],
    ["P2", (id) => `intent://cash_wallet#Intent;scheme=paytmmp;package=${P};S.browser_fallback_url=${back(id)};end`],
    ["P3", (id) => `intent://cash_wallet?featuretype=scanner#Intent;scheme=paytmmp;package=${P};S.browser_fallback_url=${back(id)};end`],
    ["P4", (id) => `intent://cash_wallet?featuretype=scan_and_pay#Intent;scheme=paytmmp;package=${P};S.browser_fallback_url=${back(id)};end`],
    ["P5", (id) => `intent://cash_wallet?featuretype=homescreen#Intent;scheme=paytmmp;package=${P};S.browser_fallback_url=${back(id)};end`],
    ["P6", (id) => `paytmmp://`],
  ]],
  ["GPay", [
    ["G1", (id) => `intent://#Intent;scheme=tez;package=${G};S.browser_fallback_url=${back(id)};end`],
    ["G2", (id) => `intent://upi#Intent;scheme=tez;package=${G};S.browser_fallback_url=${back(id)};end`],
    ["G3", (id) => `intent://#Intent;scheme=gpay;package=${G};S.browser_fallback_url=${back(id)};end`],
    ["G4", (id) => `intent://gpay.app.goo.gl/#Intent;scheme=https;package=${G};S.browser_fallback_url=${back(id)};end`],
    ["G5", (id) => `intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=${G};S.browser_fallback_url=${back(id)};end`],
    ["G6", (id) => `tez://upi/`],
  ]],
  ["PhonePe (already works — just to compare)", [
    ["E1", (id) => `intent://#Intent;scheme=phonepe;package=${PE};S.browser_fallback_url=${back(id)};end`],
  ]],
];
const list = document.getElementById("list");
for (const [app, items] of tests) {
  list.insertAdjacentHTML("beforeend", `<h2>${app}</h2>`);
  for (const [id, fn] of items) {
    const a = document.createElement("a"); a.href = fn(id);
    a.innerHTML = `${id}<small>${a.href.split("#Intent")[0]}</small>`;
    a.onclick = () => setTimeout(() => { if (!document.hidden) show(id + ": the app did not open."); }, 2500);
    list.appendChild(a);
  }
}
function show(t){const m=document.getElementById("msg");m.textContent=t;m.style.display="block";}
addEventListener("hashchange", () => { const m = location.hash.match(/#fail-(\w+)/); if (m) { show(m[1] + ": the app did not open (came back)."); history.replaceState(null, "", location.href.split("#")[0]); } });
</script></body></html>
