<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Document — KG Print</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#17171a">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { --bar: #2b2b2f; --ink: #f1f1f1; --muted: #a9a9b0; --accent: #4f7cff; --yellow: #ffd23f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #525659; color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
           background: var(--bar); padding: 8px 12px; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
    .tok { background: var(--yellow); color: #17171a; font-weight: 800; border-radius: 6px; padding: 3px 8px; }
    .name { font-weight: 600; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count { color: var(--muted); }
    .spec { display: flex; gap: 6px; flex-wrap: wrap; }
    .spec span { background: #3d3d43; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
    .spec .color { background: #8a1c56; } .spec .dbl { background: #23408f; }
    .grow { flex: 1; }
    button { font: 600 14px system-ui, sans-serif; color: var(--ink); background: #3d3d43; border: 0; border-radius: 8px;
             padding: 8px 12px; cursor: pointer; min-height: 38px; }
    button:hover { background: #4a4a51; }
    button.primary { background: var(--accent); }
    button[disabled] { opacity: .4; cursor: default; }
    .stage { height: calc(100% - 56px); }
    iframe { width: 100%; height: 100%; border: 0; display: block; background: #525659; }
    .img-wrap { padding: 16px; text-align: center; }
    .img-wrap img { max-width: 100%; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
    .docx-wrap { padding: 16px 0; }
    .docx-wrap .docx-wrapper { background: transparent !important; padding: 0 !important; }
    .docx-wrap .docx-wrapper > section.docx { box-shadow: 0 2px 10px rgba(0,0,0,.4); margin: 0 auto 16px !important; }
    .msg { max-width: 520px; margin: 60px auto; background: #fff; color: #17171a; border-radius: 12px; padding: 22px; text-align: center; }
    .warn { color: #ffcf70; font-size: 12px; font-weight: 600; }
    @media (max-width: 640px) { .name { max-width: 60vw; } .stage { height: calc(100% - 110px); } }
    @media print {
      .bar { display: none !important; }
      html, body { background: #fff; height: auto; }
      .stage { height: auto; }
      .img-wrap { padding: 0; } .img-wrap img { box-shadow: none; max-height: 100vh; }
      .docx-wrap { padding: 0; } .docx-wrap .docx-wrapper > section.docx { box-shadow: none; margin: 0 !important; }
    }
  </style>
</head>
<body>
  <div class="bar" id="bar" hidden>
    <span class="tok" id="tok"></span>
    <span class="name" id="name"></span>
    <span class="count" id="count"></span>
    <span class="spec" id="spec"></span>
    <span class="warn" id="warn"></span>
    <span class="grow"></span>
    <button id="prev" title="Previous file">◀</button>
    <button id="next" title="Next file">▶</button>
    <button id="dl">⬇ Download</button>
    <button id="pr" class="primary">🖨 Print</button>
  </div>
  <div class="stage" id="stage"><div class="msg">Loading…</div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.6/dist/docx-preview.min.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="view.js"></script>
</body>
</html>
