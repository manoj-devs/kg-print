<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Photo — KG Print</title>
  <style>
    html, body { margin: 0; background: #2b2b2f; color: #f1f1f1; font: 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .bar { position: sticky; top: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; background: #1d1d20; }
    .tok { background: #ffd23f; color: #17171a; font-weight: 800; border-radius: 6px; padding: 3px 8px; }
    .info { color: #c9c9cf; }
    .grow { flex: 1; }
    a, button { font: 600 14px system-ui, sans-serif; color: #fff; background: #3d3d43; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; text-decoration: none; }
    .primary { background: #4f7cff; }
    .wrap { text-align: center; padding: 16px; }
    img { max-width: 100%; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
    @media print { .bar { display: none; } html, body { background: #fff; } .wrap { padding: 0; } img { box-shadow: none; max-height: 100vh; } }
  </style>
</head>
<body>
  <div class="bar">
    <span class="tok" id="tok"></span>
    <span class="info" id="info"></span>
    <span class="grow"></span>
    <a id="dl" class="primary" href="#">⬇ Download</a>
    <button onclick="window.print()">🖨 Print</button>
  </div>
  <div class="wrap"><img id="img" alt=""></div>
  <script>
    // Everything comes in the link (#…) from the owner dashboard, so this page
    // opens instantly — no login or database calls.
    const p = new URLSearchParams(location.hash.slice(1));
    document.getElementById("img").src = p.get("u") || "";
    document.getElementById("dl").href = p.get("d") || p.get("u") || "#";
    document.getElementById("tok").textContent = p.get("t") || "";
    document.getElementById("info").textContent = p.get("i") || "";
    document.title = (p.get("t") || "") + " · " + (p.get("n") || "Photo");
    // Save the photo directly (works the same on every browser)
    const fileName = ((p.get("t") || "KG") + "_" + (p.get("n") || "photo.jpg")).replace(/[\\/:*?"<>|]+/g, "_");
    document.getElementById("dl").addEventListener("click", async (e) => {
      e.preventDefault();
      const btn = e.currentTarget;
      btn.textContent = "Saving…";
      try {
        const blob = await (await fetch(p.get("u"))).blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        document.body.appendChild(a); a.click(); a.remove();
        btn.textContent = "✓ Downloaded";
      } catch (err) {
        location.href = p.get("d") || p.get("u"); // fallback: let the server send it
      }
    });
  </script>
</body>
</html>
